[defaults]
inventory = inventories/hosts.yml
roles_path = roles
collections_path = collections
host_key_checking = True
retry_files_enabled = False
# 'yaml' callback ships in community.general, not ansible-core -> use default.
deprecation_warnings = False
interpreter_python = auto_silent

[ssh_connection]
ssh_args = -o ConnectTimeout=15 -o ControlMaster=auto -o ControlPersist=60s
