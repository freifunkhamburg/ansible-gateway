---
# ======================================================================
# Build a Debian 13 gateway to its full configured state in ONE run.
#
# This is the production entry point. The old per-step playbooks were
# build-out scaffolding; ordering is now encoded in the role order below.
# Steps are only needed when debugging a single layer, and can be run by
# selecting roles on the command line.
#
#   ansible-playbook playbooks/gateway.yml --check --diff    # preview
#   ansible-playbook playbooks/gateway.yml                   # apply
#
# fastd peer secrets are operator-supplied (vault). Without them the role
# renders the configuration but does not start instances; enable them with
#   -e fastd_start=true --ask-vault-pass
#
# The run is idempotent: DNS/knot, Kea, BIRD, firewall and the build roles
# only change when their inputs or upstream releases change.
# ======================================================================
- name: Configure gateway
  hosts: gw05
  become: true
  gather_facts: true
  roles:
    - base          # Debian 13 assertion, sysctl
    - regions       # derived addresses, peers, pools, expectations
    - network       # NIC names, uplink/intra-as, dummy0
    - mesh          # batman-adv + batctl + bat/VXLAN interfaces
    - data_sync     # dhcp-static checkout (before Kea reservations)
    - kea           # DHCPv4 + DHCPv6
    - bird          # OSPF/BGP/static routes
    - services      # resolver, time, vnstat, fail2ban
    - powerdns      # authoritative mesh/clients DNS (loopback; Knot Resolver forwards to it)
    - knot          # client-facing Knot Resolver (build dependency)
    - fastd         # tunnels (start requires secrets)
    - ssh           # hardening + administrator keys
    - operations    # health scripts, cron, vnstat interface policy
    - mesh_announce # respondd
    - firewall      # render and apply the ruleset; its status-page rules
                    # must be live before status_web verifies through them
    - status_web    # static status page (lighttpd + RRD); verifies over the
                    # mesh and intra-as addresses via the live ruleset

  tasks:
    # roles/firewall arms a revert guard before it restores the new ruleset:
    # if nothing confirms the change within fw_guard_seconds, it restores the
    # snapshot taken before the render. The confirmation is a *fresh* SSH
    # connection from the controller — no ControlMaster reuse, so it proves the
    # live ruleset really accepts sshd. Only then is the guard disarmed.
    # If this task fails, the guard stays armed and reverts on its own.
    - name: Prove a fresh SSH connection to the gateway still works
      ansible.builtin.command:
        argv:
          - ssh
          - -o
          - BatchMode=yes
          - -o
          - ControlMaster=no
          - -o
          - ControlPath=none
          - -o
          - ConnectTimeout=10
          - -i
          - "{{ ansible_ssh_private_key_file }}"
          - "{{ ansible_user }}@{{ ansible_host }}"
          - "true"
      delegate_to: localhost
      become: false
      register: fw_fresh_ssh
      changed_when: false
      when: fw_guard_active | default(false)

    - name: Disarm the firewall revert guard
      ansible.builtin.shell: |
        set -eu
        systemctl stop {{ fw_guard_unit }}.timer {{ fw_guard_unit }}.service 2>/dev/null || true
        systemctl reset-failed {{ fw_guard_unit }}.timer {{ fw_guard_unit }}.service 2>/dev/null || true
        logger -t ffhh-fw-guard -- "disarmed: fresh SSH connection confirmed"
      changed_when: false
      when:
        - fw_guard_active | default(false)
        - fw_fresh_ssh.rc | default(1) == 0
