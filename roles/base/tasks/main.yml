---
# Base system: the shared Debian 13 basis for every gateway.
#
# All managed gateways run the same release. The check is intentionally a
# release assertion, not a "recorded OS" comparison: a host on another Debian
# release is refused instead of being templated into a different shape.
- name: Assert the gateway runs Debian 13
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution == "Debian"
      - ansible_facts.distribution_major_version == "13"
    fail_msg: >-
      The target is {{ ansible_facts.distribution }}
      {{ ansible_facts.distribution_version }}; this automation only supports
      Debian 13. Provision the host with Debian 13 before applying it.
    quiet: true

- name: Render gateway sysctl drop-in (/etc/sysctl.d/01-gateway.conf)
  ansible.builtin.template:
    src: 01-gateway.conf.j2
    dest: /etc/sysctl.d/01-gateway.conf
    owner: root
    group: root
    mode: "0644"

- name: Apply sysctl drop-in
  ansible.builtin.command: /sbin/sysctl -p /etc/sysctl.d/01-gateway.conf
  register: sysctl_apply
  changed_when: false
  failed_when: false
