---
# Authoritative reverse-DNS server (Knot DNS, not Knot Resolver).
#
# It mirrors the community IPv4 reverse zone (112.10.in-addr.arpa,
# 10.112.0.0/16) over AXFR, so the gateway names that upstream serves
# (gw05.ffhh, gw01.ffhh, ...) resolve again.  They used to be swallowed by
# kresd's RFC 6303 empty zone 10.in-addr.arpa.
#
# No synthesis happens here: client PTRs are produced by kresd's policy
# from Kea leases (knot_client_ptr_enabled, opt-in) and keep the documented
# ipv4-<hex> naming.  IPv6 reverse DNS remains the upstream forward.
knotd_enabled: false

knotd_conf: /etc/knot/knot.conf
knotd_zone_dir: /etc/knot/zones
knotd_storage: /var/lib/knot
# Knot Resolver forwards the reverse zone here in authoritative mode, which
# uses port 53, so the server gets its own loopback address.  Nothing else on
# the host binds 127.0.0.2, and clients never reach it (loopback only).
knotd_listen: "127.0.0.2"
knotd_port: 53
knotd_unit: knot.service

# Static content for the IPv4 reverse zone is transferred from here.
knotd_master_v4: "212.12.51.134"
knotd_master_port: 53
