---
# Authoritative reverse DNS (Knot DNS).
#
# Serves 112.10.in-addr.arpa on a loopback port only; Knot Resolver forwards
# the zone to it, so clients never talk to this server and no firewall rule
# is needed.  The zone is transferred over AXFR from the community DNS: it
# carries the static gateway names (gw05.ffhh, gw01.ffhh, ...).  Without this,
# kresd's RFC 6303 empty zone 10.in-addr.arpa answers NXDOMAIN for our
# subdomain before any upstream is asked.
#
# Client PTR synthesis is not done here; that remains kresd's opt-in policy
# fed from Kea leases (roles/knot).

- name: Stop and disable Knot DNS when reverse DNS comes from upstream
  ansible.builtin.systemd_service:
    name: "{{ knotd_unit }}"
    state: stopped
    enabled: false
  when: not (knotd_enabled | bool)
  failed_when: false

- name: Remove the Knot DNS configuration when reverse DNS comes from upstream
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ knotd_conf }}"
    - "{{ knotd_zone_dir }}"
  when: not (knotd_enabled | bool)

- name: Install Knot DNS
  ansible.builtin.apt:
    name: knot
    state: present
  when: knotd_enabled | bool

- name: Remove obsolete IPv6 zone files from earlier layouts
  ansible.builtin.file:
    path: "{{ knotd_zone_dir }}"
    state: absent
  when: knotd_enabled | bool

- name: Render the Knot DNS configuration
  ansible.builtin.template:
    src: knot.conf.j2
    dest: "{{ knotd_conf }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart knot dns
  when: knotd_enabled | bool

- name: Enable and start Knot DNS
  ansible.builtin.systemd_service:
    name: "{{ knotd_unit }}"
    state: started
    enabled: true
    daemon_reload: true
  when: (knotd_enabled | bool) and not ansible_check_mode

- name: Flush knot dns handlers
  ansible.builtin.meta: flush_handlers
  when: knotd_enabled | bool

- name: Verify the transferred IPv4 reverse zone answers the gateway PTR
  ansible.builtin.command:
    cmd: >-
      dig +short +time=3 +tries=1 -x 10.112.1.5
      @{{ knotd_listen }} -p {{ knotd_port }}
  register: knotd_v4_static
  changed_when: false
  retries: 3
  delay: 3
  until: knotd_v4_static.stdout | trim == 'gw05.ffhh.'
  when: (knotd_enabled | bool) and not ansible_check_mode

- name: Assert the static gateway PTR
  ansible.builtin.assert:
    that:
      - knotd_v4_static.stdout | trim == 'gw05.ffhh.'
    fail_msg: >-
      10.112.1.5 -> '{{ knotd_v4_static.stdout | trim }}' (expected gw05.ffhh.);
      check that {{ knotd_conf }} can reach {{ knotd_master_v4 }}.

- name: Assert unassigned IPv4 addresses are not synthesized here
  ansible.builtin.command:
    cmd: >-
      dig +short +time=3 +tries=1 -x 10.112.65.37
      @{{ knotd_listen }} -p {{ knotd_port }}
  register: knotd_v4_unknown
  changed_when: false
  failed_when: false
  when: (knotd_enabled | bool) and not ansible_check_mode

- name: Assert an unassigned address stays NXDOMAIN
  ansible.builtin.assert:
    that:
      - knotd_v4_unknown.stdout | trim == ''
    fail_msg: >-
      10.112.65.37 unexpectedly resolved to '{{ knotd_v4_unknown.stdout | trim }}';
      this role serves static records only.
  when: (knotd_enabled | bool) and not ansible_check_mode

- name: Show the reverse DNS state
  ansible.builtin.debug:
    msg: >-
      static v4: {{ knotd_v4_static.stdout | trim }};
      unknown v4: '{{ knotd_v4_unknown.stdout | trim }}'
  when: (knotd_enabled | bool) and not ansible_check_mode
