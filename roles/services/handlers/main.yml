---
- name: restart unbound
  ansible.builtin.systemd_service:
    name: unbound.service
    state: restarted

- name: restart ntp
  ansible.builtin.systemd_service:
    name: "{{ ntp_unit }}"
    state: restarted

- name: restart fail2ban
  ansible.builtin.systemd_service:
    name: fail2ban.service
    state: restarted
