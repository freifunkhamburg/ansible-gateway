---
# SSH hardening for the Debian 13 base, plus the administrator keys.
#
# OpenSSH in Debian 13 already disables the older algorithm families, but an explicit
# policy survives config drops and documents the intent: public-key only,
# no root password path, AEAD/CTR ciphers, ETM MACs, modern KEX only.
#
# The drop-in is validated with `sshd -t` before the daemon restarts; an
# existing session is never cut, so a mistake is recoverable from the
# current connection.

ssh_dropin: /etc/ssh/sshd_config.d/99-ffhh-hardening.conf

# Admin keys as a map of user -> list of authorized_keys lines. These are
# the source of truth for the listed users' key logins.
ffhh_ssh_authorized_keys: {}

ssh_ciphers: "chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes128-gcm@openssh.com,aes256-ctr,aes192-ctr,aes128-ctr"
ssh_macs: "hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com,umac-128-etm@openssh.com"
ssh_kex: "sntrup761x25519-sha512@openssh.com,curve25519-sha256,curve25519-sha256@libssh.org,diffie-hellman-group16-sha512,diffie-hellman-group18-sha512"
