---
# Lean mesh-facing status page: one static HTML page plus three RRD PNG
# charts, regenerated by cron and served by lighttpd bound only to the
# gateway's mesh (bat) addresses. No JavaScript, no application server.

status_web_root: /var/www/gw-status
status_web_data: /var/lib/gw-status
status_web_script: /usr/local/bin/gw-status
status_web_port: 80

# The browser reload interval advertised by <meta http-equiv="refresh"> and
# the cron cadence of the render job. Sampling (the RRD updates) runs every
# minute so the charts keep one-minute resolution.
status_web_refresh: 300

# Kea keeps its leases in plain CSV files; the renderer counts the active
# rows (state 0) with the stdlib csv parser (user_context may contain
# commas, so a naive field split is not enough).
status_web_leases4_csv: /var/lib/kea/kea-leases4.csv
status_web_leases6_csv: /var/lib/kea/kea-leases6.csv

# fastd status sockets are root-readable only; the cron jobs run as root.
# The directory is fastd's own variable (group_vars/all: /run/fastd).
status_web_fastd_sockets: "{{ fastd_status_socket_dir }}/fastd-status.*.sock"
